<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Aluno</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="sidebar">

        <h2>Menu</h2>

        <ul>

            <li>
                <a href="#" onclick="mostrarDashboard()">
                    Início
                </a>
            </li>

            <li>
                <a href="#" onclick="mostrarDadosPessoais()">
                    Dados Pessoais
                </a>
            </li>

            <li>
                <a href="#" onclick="mostrarMaterias()">
                    Matérias
                </a>
            </li>

            <li>
                <a href="#" onclick="mostrarNotas()">
                    Situação Curricular
                </a>
            </li>

            <li>
                <a href="#" onclick="mostrarHistorico()">
                    Histórico Escolar
                </a>
            </li>

        </ul>

        <div class="logout">

            <a href="#" onclick="sair()">
                Sair
            </a>

        </div>

    </nav>

    <div class="conteudo">

        <h1 id="titulo">
            Portal do Aluno
        </h1>

        <div id="conteudo-principal"></div>

    </div>

    <!-- Modal de sair -->

    <div id="modal-sair" class="modal">

        <div class="modal-conteudo">

            <h2>Deseja sair da conta?</h2>

            <p>Você será redirecionado para a tela de login.</p>

            <div class="botoes-modal">

                <button class="btn-cancelar"
                        onclick="fecharModal()">
                    Cancelar
                </button>

                <button class="btn-sair"
                        onclick="confirmarSaida()">
                    Sair
                </button>

            </div>

        </div>

    </div>

    <script src="../JS/script.js"></script>

    <script>
        mostrarDashboard();
    </script>

</body>

</html>
